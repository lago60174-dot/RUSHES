<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#EA580C" />
  <title>FLARE Studio — Hors ligne</title>
  <style>
    html, body {
      margin: 0; height: 100%;
      background: #F8F6F2; color: #211A16;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .wrap { text-align: center; padding: 32px; max-width: 360px; }
    img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 14px; color: #66584E; line-height: 1.5; margin: 0 0 20px; }
    button {
      background: linear-gradient(135deg, #EA580C, #C2410C); color: #fff; border: none;
      padding: 11px 22px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/icon-192.png" alt="FLARE Studio" />
    <h1>Pas de connexion</h1>
    <p>FLARE Studio a besoin d'internet pour charger tes vidéos et publications. Vérifie ta connexion et réessaie.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
